
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
    <main class="contenedor-global">
        <section class="panel-derecha">
            <div class="formulario">
                <div class="marca">
                    <img src="img/logo.svg" alt="Logo de Bask" />
                    <h1>Ba<span>sk</span></h1>
                </div>
                <p class="subtitulo">Entra a la cancha</p>
                <form action="inicio.html">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required />
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
                    <p>¿No tienes una cuenta? <a href="registro.html">Crear una cuenta</a></p>
                    <div class="botones">
                        <input type="submit" value="Ingresar" />
                    </div>
                </form>
            </div>
        </section>
        <section class="panel-izquierda"></section>
    </main>
</body>
</html>
